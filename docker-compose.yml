version: '3.8'

services:
  # Optional local PostgreSQL for AWS RDS simulation
  postgres:
    image: postgres:16-alpine
    container_name: brajsahayak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brajsahayak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
